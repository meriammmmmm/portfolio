    <script>
      // Resolve the theme before first paint so there is no flash.
      // Light is the default; dark only when stored or the OS asks for it.
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            theme = "dark";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);

        // Same idea for the language: resolve it before paint so Arabic never
        // renders left-to-right for a frame. Falls back to the browser's
        // language, then English.
        var lang = "en";
        try {
          var savedLang = localStorage.getItem("lang");
          if (savedLang === "en" || savedLang === "fr" || savedLang === "ar") {
            lang = savedLang;
          } else {
            var nav = (navigator.language || "").slice(0, 2).toLowerCase();
            if (nav === "fr" || nav === "ar") lang = nav;
          }
        } catch (e) {}
        document.documentElement.setAttribute("lang", lang);
        document.documentElement.setAttribute(
          "dir",
          lang === "ar" ? "rtl" : "ltr"
        );
      })();
    </script>

  <body>

  </body>
